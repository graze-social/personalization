name: Release Docker Build

on:
  release:
    types: [published]
  # On-demand builds, so shipping a change does not require cutting a release.
  #
  # Without this the only way to produce an amd64 image was a local build, and this repo's
  # Dockerfiles have no cargo cache mounts -- so every iteration was a full cold Rust compile
  # under QEMU on an arm64 dev host (~15 min, load ~9). These runners are natively amd64, so the
  # same build needs no emulation at all.
  #
  # A dispatch build has no semver tag to derive from, so it publishes `latest` and the short SHA;
  # deploy by digest rather than by either of those, since both are mutable.
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (defaults to the branch this is dispatched on)"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # id-token lets the job mint a short-lived OIDC token and assume the ECR
    # push role. No long-lived AWS key is stored in this repository.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Both registries, deliberately, until the DigitalOcean cluster is retired.
      # That cluster still serves production and pulls from DOCR, so an
      # ECR-only push would make it impossible to ship a fix to the live estate.
      # Drop the DigitalOcean half once the cutover has soaked.
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::715841359524:role/graze-github-ecr-push
          aws-region: us-west-2

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            registry.digitalocean.com/graze-social-labs/personalization
            715841359524.dkr.ecr.us-west-2.amazonaws.com/graze/personalization
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
