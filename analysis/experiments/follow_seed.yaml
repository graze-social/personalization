# Does seeding personalization from the FOLLOW graph reach users the like graph cannot?
#
# The engine seeds exclusively from likes. Measured 2026-08-27: `no_user_data` is 98.1% of
# addressable non-personalization (100.0% in 22 of 24 hours), and 73.6% of the users it turns away
# have zero likes in 365 days — so nothing built from like history reaches them, which is why
# durable co-liker profiles cap out at 3.7%. But 86% of them follow 10+ accounts, median 50.
#
# This is the randomized test of that idea. It also matters for the holdout: ~39% of the treatment
# arm currently receives no personalized content at all, so the holdout measures a treatment that is
# undelivered for two users in five. Raising coverage raises the dose, which raises the effect, and
# that is the only route to a holdout that resolves — power cannot be bought from a richer outcome
# table (measured: 82.84x more events exist on our algos but only 0.9% are arm-mappable).
id: follow_seed
design: ab

# ⚠️ MUST be set to the moment FOLLOW_SEED_EXPERIMENT_ENABLED goes live, and re-set on any change to
# traffic_pct or salt — both move the hash boundary and reassign users, which starts a different
# experiment. The holdout spec has already been reset twice for exactly this reason.
# START, 2026-08-31T16:49:48Z. Fifth start, and the first with a population the treatment can
# actually reach.
#
# Enrolment was traffic_pct=100 over all non-holdout users until now, and measured on 2026-08-31 only
# 276 of 1,031 treated users had a `uf:` seed -- 73% of the treatment arm was untreatable and diluted
# the ITT ~3.7x. Enrolment is now eligibility-gated (no like seed AND has a uf: seed), which trades N
# (~2,062 units -> ~749) for effect size and nets roughly 2.2x on z.
#
# The estimand changes with it, deliberately: this now measures the effect on users follow-seeding
# CAN reach, not a diluted average over people it never touches. The earlier window is not merely
# under-powered, it was measuring a different and less meaningful quantity, so nothing interpretable
# is discarded by resetting.
#
# The four windows before that measured nothing at all -- see the git history of this file: the arm
# never reached the seed step, then was absent from no_user_data rows, then hung off a disabled
# branch, then was blocked by the pre-personalization seed gate.
#
# ---------------------------------------------------------------------------------------------
# START, 2026-09-02T14:37:55Z. SIXTH start, and the first reset for a reason unrelated to the
# arms: the ESTIMAND changed. primary_metric moved like_rate -> scroll_depth (PR #69, merged at
# exactly this timestamp), and that metric's value on the previous window had already been read
# (-0.2173, CI [-2.9344, +2.4999], p=0.7861) before it was promoted. Judging a primary on the
# data used to choose it is what the winsorize_quantile note below forbids, so that data is
# discarded rather than reinterpreted.
#
# ⚠️ NOTE WHAT DID *NOT* CHANGE. FOLLOW_SEED_EXPERIMENT_SALT is still v1 and TRAFFIC_PCT still
# 100, so the hash boundary has NOT moved and NO USER IS REASSIGNED. Unlike the five resets
# above, this one re-randomizes nothing; it only drops already-inspected rows. Enrolment,
# eligibility and delivery are untouched, and the dose evidence stands.
#
# ⚠️ THE DOSE CHECK'S `FOLLOW_SEED_FLIP_AT` IS DELIBERATELY LEFT AT 2026-08-31 16:49:48 AND MUST
# NOT BE "FIXED" TO MATCH THIS. That bound exists because rows written before the arm was ever
# assigned carry no `follow_seed` key, and an absent JSON field extracts as false -- it is about
# arm PRESENCE, not about the estimand. The arms did not change here, so all delivery evidence
# since the original flip remains valid, and moving the bound would discard two days of dose data
# for nothing. The two timestamps differ on purpose; that is not drift.
#
# COST, stated plainly: the 268 units accrued under the old primary are discarded. At the observed
# ~5.7 eligible users/hour the 500-unit floor is roughly 88 hours (~3.7 days) out. Nothing to do
# in the meantime -- WITHHELD is the correct state and does not mean "check again sooner".
start: "2026-09-02T14:37:55Z"

unit: user
# PRIMARY CHANGED 2026-09-02: like_rate -> scroll_depth.
#
# ⚠️ THIS WAS CHOSEN AFTER SEEING THE METRIC'S VALUE ON THIS WINDOW, and that must be on the
# record. The pre-promotion reading was diff=-0.2173 (-3.2%), CI [-2.9344, +2.4999], WLS p=0.7861 --
# null, so this is not a promoted winner; but the estimand was still selected post hoc, which is
# the practice the winsorize_quantile note below exists to forbid. Treat any reading on the CURRENT
# window as selection-contaminated. A clean pre-registered reading requires a new window, and that
# call has not been made -- see the ledger.
#
# WHY the change: like_rate is unmeasurable on this population, and that is measured, not assumed.
# Over the whole window the eligible population produced ONE like, from ONE user, across 264 units
# and 2,359 impressions; request_less and request_more produced ZERO events each, and those three
# are the entirety of METRIC_EVENTS. The like interval came out ~14.3x its own base rate. The
# holdout population over the same period: 2,844 likes from 267 users, interval 1.5x base rate.
# Eligibility IS "no like seed", so the arm selects for users who do not engage and then the
# primary measured engagement.
#
# scroll_depth is the only outcome here whose denominator every unit has BY CONSTRUCTION -- it is
# impressions per user, and an enrolled user has impressions or they would not be enrolled. So it
# scales with units rather than with rare events, which is the only way this arm can ever resolve.
# It is NOT unambiguously better when it moves: more scrolling could be engagement or could be
# scanning (zero-seed users were measured paginating at a ~1s cadence). A move is a prompt to
# investigate, not a verdict.
primary_metric: scroll_depth

# Direction: treatment = allowed to seed from follows. `params.follow_seed` is the ARM, assigned by a
# per-user salted hash before anything is served — deliberately NOT the realised seed kind, which is
# post-treatment. The dose question (did treated users actually get served) is answered by the
# `no_user_data` rate in `fallback_reason`, not by conditioning on the outcome.
arms:
  control:
    field: follow_seed
    value: false
  treatment:
    field: follow_seed
    value: true

negative_controls:
  - name: pinned_and_rotating
    reason: >
      Pinned and rotating posts are injected by inject_special_posts from a per-feed configuration
      that never consults the seed graph. Granting a follow seed cannot change which ones are chosen
      or where they sit, so their like rate must not differ between arms. If it does, the arms differ
      by something other than the seed source and the primary reading is not attributable.
    where: "source IN ('pinned', 'rotating')"

# Relevance guardrail. Follow-seeded sources are strangers who liked accounts the user follows, which
# is a looser affinity signal than a shared like — so this arm could plausibly raise engagement while
# lowering relevance. requestLess is the only direct relevance signal the client sends.
# Direction: treatment minus control, so a positive diff means MORE "show me less".
guardrails:
  - metric: request_less_rate
    max: 0.0

# Denser secondary outcome. The primary is starved -- ~1,065 likes against 31,182 impressions -- so
# impressions-per-user is reported alongside it. Density alone does not buy power here: raw, its MDE
# is ~31% of the mean, because 3.3% of users carry 36% of all impressions. Winsorizing at p90 takes
# that to ~14%.
#
# The quantile is declared HERE, up front. It changes the estimand to a capped mean and must not be
# tuned after seeing a result. The cap is pooled across both arms; a per-arm cap would itself be an
# outcome of the treatment.
#
# SECONDARY, deliberately: more scrolling is not unambiguously better. Zero-seed users were measured
# paginating at a ~1s cadence, which is scanning, not reading. Treat a move here as a prompt to
# investigate rather than a result.
scroll_depth:
  winsorize_quantile: 0.90

# Changed with the primary. A pre-period LIKE RATE cannot de-noise an impression COUNT on a
# population whose like rate is ~0 -- measured, it bought 3.4% variance reduction against the
# holdout's 46%. Past impressions predict future impressions, so the covariate now matches the
# outcome. Still gated by the re-randomization balance check, and still withheld from the gate if
# the treatment appears to have moved it.
cuped_covariate: pre_period_impressions

# REQUIRED, and not merely for the usual foreign-traffic reason. An absent JSON field extracts as
# false, so without this every row written before the flag went live — and every unenrolled row —
# lands in the CONTROL arm and silently dilutes the comparison to nothing. Requiring the nested key
# to exist restricts the population to genuinely enrolled requests.
population: >
  JSONHas(tryBase64Decode(interaction_feed_context), 'algo_id')
  AND JSONHas(tryBase64Decode(interaction_feed_context), 'follow_seed')

# For a scroll_depth primary the denominator is 1 per unit, so observations ARE units and these two
# floors coincide. 2000 was set for like_rate, where a unit carried ~8.5 impressions; keeping it
# here would demand 2000 users, which at the observed ~5.7 users/hour is over two weeks.
min_observations: 500

# Units floor, declared separately because min_observations counts IMPRESSIONS while the estimand
# is per-USER, and on this population the two diverge badly. Measured 2026-09-02: this spec cleared
# its 2000-observation floor with obs=2037 drawn from only **239 users** -- ~8.5 impressions per
# unit, against the holdout's 30 -- and a verdict was formed and read. The obs floor had never been
# a units guard.
#
# ⚠️ 500 is a floor against estimates that are simply WRONG, not a power guarantee, and it does NOT
# rescue this experiment. The eligible population's per-unit like rate is ~0.015% (the holdout
# population's is ~1.13%, i.e. ~75x higher) because eligibility IS "no like seed" -- we select for
# users who do not like things and then measure their like rate. The 2026-09-02 interval was ~13x
# its own base rate, so separating from zero would need a >1000% effect. That is a choice-of-metric
# problem. It is recorded here rather than hidden behind the gate, and it is the open question on
# this spec: see the ledger, and do NOT resolve it with a sixth window reset.
min_units: 500

notes: >
  Expect this to accrue faster than the holdout: enrolment is 100% of non-holdout users by default
  rather than 20%, and both arms are the same size.

  Read the ABSOLUTE difference as well as the relative one. The base rate here is low and a large
  relative lift on a small base is a small change in what users actually do.

  Before believing any result, check the dose. The engine can only follow-seed a user who has a
  `uf:{hash}` key, written by the personalization-follow-seeds CronJob. If that job has stalled the
  treatment arm is under-delivered and the estimate is attenuated toward zero — the same failure that
  made the holdout unconvergeable. `no_user_data` share by arm is the check.
