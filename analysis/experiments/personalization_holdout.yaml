# Does personalization help *at all*? The randomized version of the question.
#
# Everything we know about personalization's value so far is observational: personalized items show a
# 4.90% like rate against fallback's 2.23% over 7 days. That comparison is badly confounded by
# **position** — personalized items are ranked higher, so they are more visible, and a higher like
# rate would follow even if the selection were worthless. The retrospective co-liker-cap analysis made
# exactly this class of mistake and reversed under randomization.
#
# `is_personalization_holdout` is assigned by a random draw per user (PERSONALIZATION_HOLDOUT_RATE,
# now 0.05), so it is a genuine randomized arm. Comparing overall like rate between holdout and
# treated users measures the whole engine's causal contribution, position effects included, with no
# post-treatment conditioning.
#
# This is the number that should gate all further ranking work: if the engine's total lift is small,
# improving the ranking of the 30% of impressions it touches cannot matter much, and coverage or
# reach is the lever instead.
id: personalization_holdout
design: ab
# START RESET, deliberately. Before this timestamp the holdout was an independent coin flip PER
# REQUEST, so the same user was in both arms at once and any real effect was attenuated toward zero —
# the first readout's +5.4% (p=0.91) was that artifact, not a null. Assignment is now a stable
# per-user salted hash. Pooling across the change would mix two different randomization schemes, so
# everything before it is discarded rather than reused.
#
# The rate also changed here (0.05 -> 0.20). A rate change moves the hash boundary, which reassigns
# some users, so it starts a new experiment for the same reason.
# ⚠️ RESET, 2026-08-28T13:41:26Z. The 2026-08-27 reset was premature: it was made for a
# treatment change that did not actually happen, because follow-seeding was inert (see
# follow_seed.yaml for the four reasons). This is the moment the treated arm's treatment really
# changed -- half of the non-holdout population can now be seeded from the follow graph.
#
# Discarded across both resets: ~4,600 units at diff=+0.0307 (+287.9%), p=0.1087. Positive, large,
# and NOT converging -- p had risen from 0.0952 as the sample grew -- so nothing that was going to
# resolve was lost. The reason it could not resolve is the reason for the flip: ~39% of the treated
# arm received no personalized content at all.
# NOT reset for the 2026-08-31T16:49:48Z eligibility-gating change, deliberately.
#
# That change did alter which users receive follow-seeding, so a strict reading argues for a reset.
# But it only affects the ~749 eligible users, a small fraction of this experiment's treated arm,
# and this window is finally accruing real signal -- p has been falling as units grow rather than
# rising as it did across 13 days of the previous window. Resetting a fourth time would cost more
# than the contamination it removes. Judgment call, recorded rather than silent.
start: "2026-08-28T13:41:26Z"
unit: user
primary_metric: like_rate

arms:
  # NOTE the direction: `control` is the HOLDOUT (personalization suppressed) and treatment is the
  # normal path. Stated explicitly because reading the sign backwards would invert the conclusion.
  control:
    field: is_personalization_holdout
    value: true
  treatment:
    field: is_personalization_holdout
    value: false

negative_controls:
  - name: pinned_and_rotating
    reason: >
      Pinned and rotating posts are injected by inject_special_posts from a per-feed configuration
      that never consults the personalization engine, the co-liker graph, or the user's likes. The
      holdout cannot change which ones are chosen or where they sit, so their like rate must not
      differ between arms. If it does, the arms differ by something other than personalization —
      most likely a traffic or client mix imbalance — and the primary reading is not attributable.
    where: "source IN ('pinned', 'rotating')"

# Relevance guardrail, distinct from the negative control above.
#
# The primary metric is like_rate, which is pure engagement. Optimising engagement alone selects for
# engagement-bait — the standard way a recommender gets worse while its headline number improves —
# and the remit is content that is relevant, not merely clickable. `requestLess` is the only direct
# relevance signal the client sends: an explicit "show me less of this" rather than a proxy. If
# personalization raises it, the engine is producing content people actively do not want, and that
# is worth seeing next to any like-rate win rather than discovered later.
#
# Direction: `control` is the HOLDOUT, so diff = personalized - suppressed. A positive diff means
# personalization produced MORE "show me less", hence max: 0.0.
#
# This guardrail is underpowered and is expected to stay quiet — 221 requestLess events across the
# first 11 days. The readout prints its event count for exactly that reason. A quiet guardrail here
# is not evidence of safety.
guardrails:
  - metric: request_less_rate
    max: 0.0

# Denser secondary outcome. The primary is starved -- ~1,065 likes against 31,182 impressions -- so
# impressions-per-user is reported alongside it. Density alone does not buy power here: raw, its MDE
# is ~31% of the mean, because 3.3% of users carry 36% of all impressions. Winsorizing at p90 takes
# that to ~14%.
#
# The quantile is declared HERE, up front. It changes the estimand to a capped mean and must not be
# tuned after seeing a result. The cap is pooled across both arms; a per-arm cap would itself be an
# outcome of the treatment.
#
# SECONDARY, deliberately: more scrolling is not unambiguously better. Zero-seed users were measured
# paginating at a ~1s cadence, which is scanning, not reading. Treat a move here as a prompt to
# investigate rather than a result.
scroll_depth:
  winsorize_quantile: 0.90

cuped_covariate: pre_period_like_rate

population: "JSONHas(tryBase64Decode(interaction_feed_context), 'algo_id')"

min_observations: 2000

notes: >
  Expect this to be slow. The holdout is deliberately only 5% of users, so the control arm accrues
  roughly 20x slower than treatment; that asymmetry costs power but was the right trade when the
  holdout was cut from 0.5 to 0.05 to buy experiment throughput everywhere else. The anytime-valid
  interval means this can be watched daily without penalty rather than waiting for a fixed horizon.

  Read the *absolute* difference, not only the relative one. A large relative lift on a 2% base rate
  is a small absolute change in what users do, and the decision this gates — whether to invest in
  ranking quality or in personalized coverage — depends on the absolute size.
