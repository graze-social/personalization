# Experiment readout, run on a schedule.
#
# Pattern copied from feed-processor/kube/analytics-freshness-cronjob.yml (the established CronJob
# shape on this cluster): Forbid concurrency, a hard deadline, envFrom a secret, and an image pull
# secret.
#
# Scheduled hourly because the verdict is gated on a confidence sequence over the ARM DIFFERENCE,
# whose error rate survives repeated inspection. Note the precision: this justification stood here
# before the code supported it, when the only sequence computed was over the per-unit rate POOLED
# across arms — an interval on a level, which for a non-negative rate cannot contain zero. The
# fixed-horizon WLS and permutation p-values are still printed, and reading THOSE hourly does
# inflate their error rate, which is why they are labelled diagnostic.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: personalization-analysis
  namespace: default
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: dockerhub-secret
          containers:
            - name: analysis
              image: dgaff/graze-analysis@sha256:cf397a9139eb24f622d8e72c0ba74d6dde36fd4e74774aecbbfaf14f0eb4d9d6
              # Override the entrypoint so one job runs both the experiment readouts and the
              # density-drift guard. The guard exits non-zero only on a *detection* (a feed that has
              # already stopped being personalized), so a real regression shows up as a failed Job
              # while a mere proximity warning does not.
              command: ["sh", "-c"]
              args:
                - |
                  set -o pipefail
                  # Contract check FIRST. A spec whose arm field nothing writes does not error,
                  # it compares zero rows and reports WITHHELD -- indistinguishable from "not enough
                  # data yet". That silence hid a broken consumer for 24 hours. Checking before the
                  # readout means a field rename surfaces as a loud failure, not a quiet null.
                  python -m graze_analysis.contract \
                    experiments/personalization_holdout.yaml \
                    experiments/follow_seed.yaml \
                    experiments/max_sources_250_vs_10000.yaml
                  contract=$?
                  python -m graze_analysis.runner \
                    experiments/personalization_holdout.yaml \
                    experiments/follow_seed.yaml \
                    experiments/max_sources_250_vs_10000.yaml
                  readout=$?
                  python -m graze_analysis.drift
                  drift=$?
                  # Surface either failure, preferring the drift detection since it is actionable.
                  [ $contract -ne 0 ] && exit $contract
                  [ $drift -ne 0 ] && exit $drift
                  exit $readout
              # Same wiring the personalization-api deployment uses. CLICKHOUSE_HOST/PORT/USER/
              # PASSWORD live in app-secrets; DATABASE and SECURE come from the configmap. Reusing
              # them means no new credential to provision and no chance of the analysis reading a
              # different cluster than the service it is analysing.
              envFrom:
                - configMapRef:
                    name: personalization-env
                - secretRef:
                    name: app-secrets
                # Must come last, exactly as in the personalization-api deployment: both secrets define
                # REDIS_URL and the later entry wins, so this is what makes the drift guard read the same
                # Valkey the service reads rather than a different one.
                - secretRef:
                    name: personalization-secrets
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
