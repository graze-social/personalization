# The live `personalization-api` Deployment, as it actually runs on graze-prod (EKS us-west-2,
# namespace default) since the 2026-10-06 move off the DO sfo3 cluster.
#
# This file previously described a Deployment named `graze-personalization-api` running
# `python -m graze_personalization api`. That object does not exist in the cluster, and no
# `graze_personalization` Python module exists in this repo -- it was a pre-Rust fiction. Applying
# it would not have touched the running service (different name); it would have stood up a second,
# broken Deployment beside it.
#
# The running Deployment was created imperatively and has only ever been updated imperatively, so
# until now its spec existed nowhere but in the cluster. Recorded here so it is recoverable and
# reviewable.
#
# ── `image` is a PLACEHOLDER. Substitute the live digest before applying or diffing. ──
#
# This file records the deployment's STRUCTURE. It deliberately does not record which image is
# running, because it cannot: deploys are `kubectl set image ... @sha256:<digest>`, so the cluster
# moves ahead of this file on every release. A digest pinned here was wrong by default -- and its
# real effect was worse than useless, because `kubectl apply -f` would silently ROLL THE FLEET
# BACK to whatever stale digest the file happened to hold. That drifted within an hour of this
# file first being written.
#
# So the tag below resolves to nothing on purpose. Applied as-is it fails closed: the new pod
# cannot pull, and because the strategy is maxUnavailable 0 the rollout stalls with the old pods
# still serving. A loud stall beats a silent rollback.
#
# Both diffing and applying take the same shape -- read the live digest, substitute, pipe:
#
#   DIGEST=$(kubectl get deploy personalization-api \
#     -o jsonpath='{.spec.template.spec.containers[0].image}')
#   sed "s|^\( *\)image: .*|\1image: $DIGEST|" kube/api-deployment.yaml | kubectl diff -f -
#
# Swap `diff` for `apply` to apply. The diff is the check on everything except the image, and it
# changes nothing; it returned zero bytes against revision 58 on 2026-09-02.
#
# The API defaults the server fills in itself (progressDeadlineSeconds, revisionHistoryLimit,
# dnsPolicy, terminationGracePeriodSeconds, ...) are deliberately absent and cause no diff. The pod
# template's `kubectl.kubernetes.io/restartedAt` annotation is deliberately PRESENT: it is in the
# live last-applied-configuration, so omitting it would make `apply` delete it and restart the
# fleet. As of 2026-10-26 the only diff against live is the placeholder image.
#
# ── Related manifests ──
#
# Service `personalization-api` (ClusterIP, 80 -> 8080) is in `kube/service.yaml` and the
# PodDisruptionBudget `personalization-api-pdb` (minAvailable: 2) in `kube/api-pdb.yaml`; both
# matched live on 2026-10-26. The PDB is load-bearing for the deploy policy: with 3 replicas and
# minAvailable 2, a rollout can only ever take one pod at a time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: personalization-api
  labels:
    app: personalization-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: personalization-api
  # Surge-first, and this is the standing deploy policy rather than an incidental default: a new
  # pod must be Ready before any old pod is taken down, so a rollout cannot dip below full
  # capacity. Combined with the startupProbe below, a broken image stalls the rollout instead of
  # draining the fleet.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      # Cluster history from a `kubectl rollout restart` at the 2026-10-05 cutover. It is in
      # the live last-applied-configuration, so leaving it out would make `apply` delete it --
      # a pod-template change, i.e. a full restart. Kept so applying this file is a no-op.
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-10-05T21:43:54-04:00"
      labels:
        app: personalization-api
    spec:
      containers:
        - name: personalization-api
          # PLACEHOLDER -- see the header. Substitute the live digest before applying.
          #
          # Real deploys pin a DIGEST and never a tag: `latest` and the short-SHA tag are both
          # mutable, and concurrent release builds from different refs overwrite `latest`.
          image: 715841359524.dkr.ecr.us-west-2.amazonaws.com/graze/personalization:PLACEHOLDER-SEE-HEADER
          # Explicit, and NOT the API default for a digest-pinned image (which is IfNotPresent).
          imagePullPolicy: Always
          command: ["/app/graze-api"]
          ports:
            - containerPort: 8080
              protocol: TCP
          # Bulk config comes from the ConfigMap and secrets; the inline `env` below OVERRIDES and
          # extends it. Anything set in both places resolves to the inline value, which is why
          # reading the ConfigMap alone gives a wrong picture of what is live.
          envFrom:
            - configMapRef:
                name: personalization-env
            - secretRef:
                name: app-secrets
            - secretRef:
                name: personalization-secrets
          env:
            # ClickHouse workload user. Explicit env beats the CLICKHOUSE_USER /
            # CLICKHOUSE_PASSWORD that envFrom app-secrets also supplies.
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: clickhouse-workload-users
                  key: FEED_SERVING_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-workload-users
                  key: FEED_SERVING_PASSWORD
            # Pool-size gate (step 0 of compute_personalization). Lives here and NOT in the
            # ConfigMap, which is easy to miss when checking whether the gate is enabled.
            - name: MIN_CANDIDATE_POOL_FOR_PERSONALIZATION
              value: "500"
            - name: AUTHOR_AFFINITY_ENABLED
              value: "false"
            - name: DURABLE_PROFILE_SHADOW_MODE
              value: "1"
            - name: THOMPSON_PERSIST_ENABLED
              value: "1"
            - name: THOMPSON_PERSIST_INTERVAL_SECONDS
              value: "30"
            - name: AB_EXPERIMENT_ENABLED
              value: "0"
            - name: AB_EXPERIMENT_DIMENSION
              value: max_sources
            - name: AB_EXPERIMENT_VALUES
              value: 250,10000
            - name: AB_EXPERIMENT_TRAFFIC_PCT
              value: "100"
            - name: AB_EXPERIMENT_SALT
              value: v1
            # Randomization for the running holdout experiment. Changing this rate moves the arm
            # boundary and therefore STARTS A NEW EXPERIMENT -- record a fresh start date in the
            # spec if you touch it.
            - name: PERSONALIZATION_HOLDOUT_RATE
              value: "0.20"
            - name: FOLLOW_SEED_EXPERIMENT_ENABLED
              value: "1"
            - name: FOLLOW_SEED_EXPERIMENT_TRAFFIC_PCT
              value: "100"
            - name: FOLLOW_SEED_EXPERIMENT_SALT
              value: v1
            - name: FOLLOW_SEED_WEIGHT_MODE
              value: uniform
            # Interleaving experiment. CONTROL and TREATMENT are both post_first, with SELF_CHECK
            # on: this is the A/A self-check that validates the interleaving readout, not a live
            # comparison. Changing either arm starts a real experiment.
            - name: INTERLEAVE_ENABLED
              value: "1"
            - name: INTERLEAVE_SELF_CHECK
              value: "1"
            - name: INTERLEAVE_CONTROL
              value: post_first
            - name: INTERLEAVE_TREATMENT
              value: post_first
            - name: INTERLEAVE_TRAFFIC_PCT
              value: "10"
            - name: INTERLEAVE_SALT
              value: v1
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: 500m
              memory: 2Gi
          # startupProbe, NOT readinessProbe, for the Redis-dependent check.
          #
          # /internal/ready returns 503 when a Redis ping fails. All replicas share one Valkey, so
          # as a readinessProbe a single blip fails readiness on every pod simultaneously and
          # empties the Service -- a correlated total outage, strictly worse than serving degraded
          # responses. This repo already has that failure mode on record elsewhere: a readiness
          # check tied to an upstream dependency is what wedged network-cache on grazer-prod2 for
          # hours.
          #
          # As a startupProbe it gates initial traffic until Redis is connected and is then never
          # evaluated again, so a later blip cannot take pods out of rotation. 3s x 40 = up to 120s
          # to connect before the pod is failed.
          startupProbe:
            httpGet:
              path: /internal/ready
              port: 8080
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 40
          # /internal/alive is a static 200, so it cannot correlate-fail on a dependency. This is
          # what actually closes the rollout gap: with no readinessProbe at all, Kubernetes marks a
          # pod Ready the instant the container starts and routes traffic to it before the HTTP
          # listener is accepting connections.
          readinessProbe:
            httpGet:
              path: /internal/alive
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
