# The live `personalization-candidate-sync` Deployment, as it runs on graze-prod (EKS us-west-2).
#
# This file previously described `graze-personalization-candidate-sync` running
# `python -m graze_personalization candidate-sync`, the pre-Rust service. That Deployment does not
# exist, and applying the old file would have stood up a second, broken one beside the real
# service rather than touching it. Rewritten from the live object on 2026-10-26.
#
# The image is pinned to what was running that day. Deploys are `kubectl set image`, so bump this
# with every release or it becomes a rollback waiting for the next `apply`.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: personalization-candidate-sync
  name: personalization-candidate-sync
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: personalization-candidate-sync
  strategy:
    rollingUpdate:
      maxSurge: "25%"
      maxUnavailable: "25%"
    type: RollingUpdate
  template:
    metadata:
      # Cluster history from a `kubectl rollout restart` at the 2026-10-05 cutover. It is in
      # the live last-applied-configuration, so leaving it out would make `apply` delete it --
      # a pod-template change, i.e. a full restart. Kept so applying this file is a no-op.
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-10-05T21:43:54-04:00"
      labels:
        app: personalization-candidate-sync
    spec:
      containers:
      - command:
        - /app/graze-candidate-sync
        env:
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              key: BATCH_USER
              name: clickhouse-workload-users
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: BATCH_PASSWORD
              name: clickhouse-workload-users
        - name: SYNC_FALLBACK_MAX_AGE_HOURS
          value: "336"
        envFrom:
        - configMapRef:
            name: personalization-env
        - secretRef:
            name: app-secrets
        - secretRef:
            name: personalization-secrets
        image: "715841359524.dkr.ecr.us-west-2.amazonaws.com/graze/personalization:d-2fc398a91fd0"
        name: personalization-candidate-sync
        resources:
          limits:
            cpu: 500m
            memory: 768Mi
          requests:
            cpu: 200m
            memory: 512Mi
