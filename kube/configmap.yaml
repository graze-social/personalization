# The live `personalization-env` ConfigMap: bulk config for every personalization workload
# (personalization-api, candidate-sync, like-streamer, follow-seeds, and the analysis CronJobs),
# all of which load it with `envFrom: configMapRef`. Recorded from graze-prod (EKS us-west-2) on
# 2026-10-26.
#
# This file previously held a ConfigMap `graze-personalization-config` and a Secret
# `graze-personalization-secrets` full of CHANGE_ME placeholders. Neither has existed on the
# cluster since at least the AWS move, and nothing live references them.
#
# ADMIN_API_KEY is deliberately NOT here. It is a credential, and lives in the
# `personalization-secrets` Secret, which every consumer loads AFTER this ConfigMap, so the
# Secret's value is the one in effect. It used to sit here too (an identical copy, already
# shadowed by the Secret); it was removed 2026-10-26 and personalization-api was restarted
# canary-first to prove new pods get it from the Secret (admin paths: no key 401, key 200).
# Do not add it back.
#
# Per-workload `env:` entries in the Deployment and CronJob manifests OVERRIDE these values
# (RUST_LOG, the ClickHouse workload user, experiment flags), so read both before concluding
# what a pod actually runs with.
apiVersion: v1
data:
  CLICKHOUSE_DATABASE: default
  CLICKHOUSE_SECURE: "true"
  DEFAULT_TIME_WINDOW_HOURS: "144"
  EXCLUSION_LIST: "did:plc:cxzhucds4aqj2npthbrhemvl"
  FEED_CACHE_BATCH_SIZE: "1000"
  FEED_GENERATOR_DID: "did:web:beta.graze.social"
  GRAZE_AUDIT_ALL_USERS: "false"
  GRAZE_AUDIT_ENABLED: "false"
  GRAZE_AUDIT_SAMPLE_RATE: "0.5"
  GRAZE_READ_ONLY_MODE: "false"
  HTTP_HOST: "0.0.0.0"
  HTTP_PORT: "8080"
  HTTP_WORKERS: "4"
  INVERTED_MIN_POST_LIKES: "10"
  LIKE_TTL_DAYS: "6"
  METRICS_ENABLED: "true"
  METRICS_PORT: "8081"
  MIN_POOL_SCOREABLE_POSTS: "500"
  MIN_POOL_SCOREABLE_SHARE: "0.04"
  REDIS_SOCKET_TIMEOUT: "30"
  RUST_BACKTRACE: full
  RUST_LOG: debug
  SEEN_POSTS_TTL_HOURS: "24"
kind: ConfigMap
metadata:
  name: personalization-env
  namespace: default
