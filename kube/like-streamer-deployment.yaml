# The live `personalization-like-streamer` Deployment, as it runs on graze-prod (EKS us-west-2).
#
# This file previously described `graze-personalization-like-streamer` running
# `python -m graze_personalization like-streamer`, the pre-Rust service. That Deployment does not
# exist, and applying the old file would have stood up a second, broken one beside the real
# service rather than touching it. Rewritten from the live object on 2026-10-26.
#
# Image pinned by digest on 2026-10-26: sha256:f18cb940..., the same image the pod had been
# running under the mutable tag `latestrs` (also tagged d-f18cb9404550), so pinning changed no
# code. Bump the digest with each release.
#
# Recreate, not RollingUpdate. This is a singleton Jetstream consumer sharing one cursor in Redis,
# and not every write is idempotent: the per-user like counts (HINCRBY on `ulc`) and the
# user-liked-authors counters INCREMENT. A surge rollout runs two streamers over the same events
# and double-counts every like in the overlap. Recreate stops the old pod first; the new one
# resumes from the committed cursor, so the few-second gap loses nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: personalization-like-streamer
  name: personalization-like-streamer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: personalization-like-streamer
  strategy:
    type: Recreate
  template:
    metadata:
      # Cluster history from a `kubectl rollout restart` at the 2026-10-05 cutover. It is in
      # the live last-applied-configuration, so leaving it out would make `apply` delete it --
      # a pod-template change, i.e. a full restart. Kept so applying this file is a no-op.
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-10-05T21:43:55-04:00"
      labels:
        app: personalization-like-streamer
    spec:
      containers:
      - command:
        - /app/graze-like-streamer
        env:
        - name: CLICKHOUSE_USER
          valueFrom:
            secretKeyRef:
              key: INGEST_WRITER_USER
              name: clickhouse-workload-users
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: INGEST_WRITER_PASSWORD
              name: clickhouse-workload-users
        envFrom:
        - configMapRef:
            name: personalization-env
        - secretRef:
            name: app-secrets
        - secretRef:
            name: personalization-secrets
        image: "715841359524.dkr.ecr.us-west-2.amazonaws.com/graze/personalization@sha256:f18cb94045501f3a1a375c12025d5706136a16e6c180f55b0c1a388eba190df3"
        name: personalization-like-streamer
        resources:
          limits:
            cpu: 300m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 320Mi
