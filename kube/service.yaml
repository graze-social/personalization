# In-cluster Service for the live `personalization-api` Deployment.
#
# This file previously described a Service named `graze-personalization-api` selecting
# `app=graze-personalization,component=api` -- labels no pod in the cluster carries -- and an
# Ingress on `personalization.internal.example.com`, a placeholder host. Neither object exists.
# Applying the old file would have created a Service selecting nothing (silently: an empty
# Endpoints list is not an error) alongside an Ingress routing a domain nobody owns.
#
# Created imperatively; recorded here so it is recoverable. Matched the live object on graze-prod
# (EKS us-west-2) on 2026-10-26.
#
# ── The public path is no longer here ──
#
# This file also held the DO-era nginx Ingress for `beta.graze.social`. It does not exist on
# graze-prod (checked 2026-10-26), so it was removed rather than kept as a file that would create
# an object nobody routes through. Since the 2026-10-06 move to AWS, beta.graze.social resolves
# to an AWS load balancer in us-west-2, and whatever routes it to this Service lives outside the
# `default` namespace and outside this repo. The host is still load-bearing: it is the host in
# FEED_GENERATOR_DID (did:web:beta.graze.social), so changing it invalidates the service's
# identity to every client, not just its routing.
#
# See kube/api-deployment.yaml for the Deployment and kube/api-pdb.yaml for the disruption budget.
apiVersion: v1
kind: Service
metadata:
  name: personalization-api
spec:
  type: ClusterIP
  # Matches the Deployment's pod label. In-cluster consumers reach this as
  # `personalization-api` / `personalization-api.default.svc.cluster.local`.
  selector:
    app: personalization-api
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
